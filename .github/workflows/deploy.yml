name: MultiHAT Academy CI/CD

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend
      - name: Install Backend Deps
        run: cd backend && npm ci
      - name: Generate Prisma Client
        run: cd backend && npx prisma generate
      - name: Backend Lint & Test
        run: cd backend && npm run lint && npm run test && npm run test:e2e

      # Frontend
      - name: Install Frontend Deps
        run: cd frontend && npm ci
      - name: Frontend Build Check
        run: cd frontend && npm run build

  deploy-backend:
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      DROPLET_IP: ${{ secrets.DROPLET_IP }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: SSH Deploy to DigitalOcean
        if: ${{ env.DROPLET_IP != '' && env.SSH_PRIVATE_KEY != '' }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.DROPLET_IP }}
          username: ${{ env.DEPLOY_USER || 'deploy' }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/academy/backend
            git pull origin main
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            npm prune --omit=dev
            pm2 restart ecosystem.config.js --env production

      - name: Health Check
        if: ${{ env.DROPLET_IP != '' && env.SSH_PRIVATE_KEY != '' }}
        run: |
          echo "Waiting 10s for app to start..."
          sleep 10
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://api.multihat.dev/api/v1/healthz || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed (HTTP $STATUS)"
            exit 1
          fi
          echo "✅ Health check passed (HTTP $STATUS)"
